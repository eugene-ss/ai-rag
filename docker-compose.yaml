# Local production-like stack.
# The api service serves the online query path only; indexing runs in worker.

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      RAG_ENV: docker
      RAG_INDEX_VERSION: v1
      RAG_COLLECTION_ALIAS: docs_live
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379/0
    depends_on:
      qdrant:
        condition: service_started
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    # Offline pipeline: reindex on demand, never in the request path.
    command: ["python", "main.py", "reindex", "--source", "/data/raw", "--index-version", "v1"]
    environment:
      RAG_ENV: docker
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data:ro
    depends_on:
      qdrant:
        condition: service_started
      opensearch:
        condition: service_healthy
    profiles:
      - jobs

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.16.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
  opensearch_data:
