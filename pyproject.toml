[project]
name = "ai-rag"
version = "0.1.0"
description = "Production RAG: offline indexing and online query as separate systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.11"]
opensearch = ["opensearch-py>=2.6"]
rerank = ["sentence-transformers>=3.0"]
openai = ["openai>=1.40"]
redis = ["redis>=5.0"]
pdf = ["pypdf>=4.3"]
# Everything needed to run against real backends.
all = [
    "qdrant-client>=1.11",
    "opensearch-py>=2.6",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "redis>=5.0",
    "pypdf>=4.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
rag = "rag.jobs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.hatch.build.targets.wheel.force-include]
"src/rag/prompts/templates" = "rag/prompts/templates"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC",
    "S",    # bandit
    "PTH",  # prefer pathlib
    "RET",  # return consistency
    "TID",  # tidy imports
]
ignore = [
    "S101",  # asserts are fine in tests and internal invariants
    "B008",  # FastAPI Depends/Header in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/rag/api/deps.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "opensearchpy.*",
    "sentence_transformers.*",
    "openai.*",
    "redis.*",
    "pypdf.*",
]
ignore_missing_imports = true

# numpy arrives transitively with the qdrant extra and ships stubs that use
# 3.12-only syntax, which mypy parses under our declared python_version = 3.11.
# Skip it rather than raise the floor: we still support 3.11 at runtime.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.coverage.run]
source = ["src/rag"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
# A ratchet, not a target. Set just under the current number so a change that
# adds untested code fails the build; raise it as coverage improves. Deliberately
# global: per-module floors invite arguing with the tool instead of writing tests.
fail_under = 74
show_missing = true
